name: Build Unit OS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Where to compile (self-hosted needs unit-build-1 online)
        type: choice
        options: [self-hosted, github-hosted]
        default: self-hosted
# One run per pull request or branch. A newer push to a pull request cancels its running build;
# on main a running build always finishes, and only the newest waiting run is kept.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Compiles the image. Runs on the self-hosted runner (unit-build-1, a VM on the Windows server),
  # or on a GitHub-hosted machine when a manual run picks github-hosted.
  # This repository is public: pull requests from forks always build on a GitHub-hosted machine,
  # so code from outside the repository never runs on the self-hosted runner.
  build:
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.runner == 'github-hosted') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-24.04' || fromJSON('["self-hosted","unit-build"]') }}
    timeout-minutes: 358
    strategy:
      matrix:
        config: [unit_qemu_x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo swapoff -a && sudo rm -f /mnt/swapfile /swapfile || true
          df -h /
      - name: Install host packages
        if: runner.environment == 'github-hosted'
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=300 -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold"
          sudo -E apt-get update $APT
          sudo -E apt-get install -y --no-install-recommends $APT build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            unzip rsync cpio file wget python3 ccache \
            patch perl git bzip2 xz-utils gzip g++ debianutils ca-certificates
      - name: Check host packages
        if: runner.environment == 'self-hosted'
        run: |
          # Installed once by setup-runner.sh; the runner can't use sudo. List anything missing.
          missing=""
          for p in build-essential bc bison flex libssl-dev libelf-dev libncurses-dev unzip rsync cpio file wget \
                   python3 ccache patch perl git bzip2 xz-utils gzip g++ debianutils ca-certificates; do
            dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"
          done
          [ -z "$missing" ] || { echo "::error::Missing on the runner VM:$missing (sudo apt-get install -y$missing)"; exit 1; }
          df -h "$GITHUB_WORKSPACE" | tail -1
      - name: Use persistent caches
        if: runner.environment == 'self-hosted'
        run: |
          # Keep downloads and ccache on the VM between runs instead of moving them through GitHub's cache.
          mkdir -p "$HOME/unit-cache/dl" "$HOME/unit-cache/ccache"
          rm -rf dl .ccache
          ln -s "$HOME/unit-cache/dl" dl
          ln -s "$HOME/unit-cache/ccache" .ccache
          du -sh "$HOME/unit-cache"/* || true
      - name: Restore download and compiler caches
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v4
        with:
          path: |
            dl
            .ccache
          key: unit-os-${{ matrix.config }}-${{ hashFiles('external/configs/*', '.gitmodules') }}-${{ github.run_id }}
          restore-keys: |
            unit-os-${{ matrix.config }}-${{ hashFiles('external/configs/*', '.gitmodules') }}-
            unit-os-${{ matrix.config }}-
      - name: Build
        timeout-minutes: 325
        run: |
          set +e
          make UNIT_IMAGE=${{ matrix.config }} > build.log 2>&1 &
          pid=$!
          n=0
          while kill -0 $pid 2>/dev/null; do sleep 60; n=$((n+1)); grep '^>>>' build.log | tail -1; [ $((n%15)) -eq 0 ] && df -h / | tail -1; done
          wait $pid; rc=$?
          [ $rc -ne 0 ] && tail -150 build.log
          exit $rc
        shell: bash
      - name: Save download and compiler caches
        if: always() && runner.environment == 'github-hosted'
        uses: actions/cache/save@v4
        with:
          path: |
            dl
            .ccache
          key: unit-os-${{ matrix.config }}-${{ hashFiles('external/configs/*', '.gitmodules') }}-${{ github.run_id }}
      - name: Record download hashes
        if: always()
        run: find -L dl -name 'linux-*.tar.*' -exec sha256sum {} \; || true
      - name: Licence information
        run: make UNIT_IMAGE=${{ matrix.config }} legal-info >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.config }}
          path: |
            output/${{ matrix.config }}/images/
            output/${{ matrix.config }}/legal-info/manifest.csv
            build.log
          if-no-files-found: warn

  # Unit tests of Unit's own Rust code (compositor layout classes and density, Requirement
  # OS-52; the Settings, Notification and Session services).
  # GitHub-hosted, so it runs alongside the image build.
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -o Acquire::Retries=5
          sudo -E apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
            libudev-dev libinput-dev libseat-dev libgbm-dev libdrm-dev libxkbcommon-dev libegl-dev libgles-dev pkg-config \
            dbus libglib2.0-bin
      - name: Unit compositor tests
        working-directory: external/package/unit-compositor/src
        run: cargo test --locked --release
      - name: Unit services tests
        working-directory: external/package/unit-services/src
        run: cargo test --locked --release
      - name: Shell UI colour rules tests
        working-directory: external/package/unit-shell/src
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror palette.cpp tests/palette_test.cpp -o /tmp/palette_test
          /tmp/palette_test
      - name: Unit services on a live session bus
        working-directory: external/package/unit-services/src
        run: |
          cargo build --locked --release
          dbus-run-session -- ../tests/bus-check.sh target/release

  # Boots the image in QEMU. Always on a GitHub-hosted machine, which has KVM;
  # the self-hosted VM has no /dev/kvm while the Windows hypervisor is on.
  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        config: [unit_qemu_x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -o Acquire::Retries=5
          sudo -E apt-get install -y --no-install-recommends -o Acquire::Retries=5 qemu-system-x86
          sudo chmod 666 /dev/kvm || true
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.config }}
      - name: Smoke check in emulation
        run: make UNIT_IMAGE=${{ matrix.config }} smoke
      - name: Test harness in emulation
        run: make UNIT_IMAGE=${{ matrix.config }} harness
      - name: Display and input check in emulation (Unit compositor)
        run: make UNIT_IMAGE=${{ matrix.config }} display
      - name: Shell UI check in emulation
        run: make UNIT_IMAGE=${{ matrix.config }} shell
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.config }}-tests
          path: |
            smoke.log
            harness.log
            display.log
            shell.log
            results/
          if-no-files-found: warn
