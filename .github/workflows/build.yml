name: Build Unit OS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      matrix:
        config: [unit_qemu_x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo swapoff -a && sudo rm -f /mnt/swapfile /swapfile || true
          df -h /
      - name: Install host packages
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=300 -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold"
          sudo -E apt-get update $APT
          sudo -E apt-get install -y --no-install-recommends $APT build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            unzip rsync cpio file wget python3 qemu-system-x86 ccache \
            patch perl git bzip2 xz-utils gzip g++ debianutils ca-certificates
          sudo chmod 666 /dev/kvm || true
      - name: Restore download and compiler caches
        uses: actions/cache/restore@v4
        with:
          path: |
            dl
            .ccache
          key: unit-os-${{ matrix.config }}-${{ hashFiles('external/configs/*', '.gitmodules') }}-${{ github.run_id }}
          restore-keys: |
            unit-os-${{ matrix.config }}-${{ hashFiles('external/configs/*', '.gitmodules') }}-
            unit-os-${{ matrix.config }}-
      - name: Build
        timeout-minutes: 300
        run: |
          set +e
          make UNIT_IMAGE=${{ matrix.config }} > build.log 2>&1 &
          pid=$!
          n=0
          while kill -0 $pid 2>/dev/null; do sleep 60; n=$((n+1)); grep '^>>>' build.log | tail -1; [ $((n%15)) -eq 0 ] && df -h / | tail -1; done
          wait $pid; rc=$?
          [ $rc -ne 0 ] && tail -150 build.log
          exit $rc
        shell: bash
      - name: Save download and compiler caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            dl
            .ccache
          key: unit-os-${{ matrix.config }}-${{ hashFiles('external/configs/*', '.gitmodules') }}-${{ github.run_id }}
      - name: Record download hashes
        if: always()
        run: find dl -name 'linux-*.tar.*' -exec sha256sum {} \; || true
      - name: Smoke check in emulation
        run: make UNIT_IMAGE=${{ matrix.config }} smoke
      - name: Licence information
        run: make UNIT_IMAGE=${{ matrix.config }} legal-info >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.config }}
          path: |
            output/${{ matrix.config }}/images/
            output/${{ matrix.config }}/legal-info/manifest.csv
            build.log
            smoke.log
          if-no-files-found: warn
