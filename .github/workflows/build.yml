name: Build Unit OS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      matrix:
        config: [unit_qemu_x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install host packages
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            unzip rsync cpio file wget python3 qemu-system-x86 ccache \
            patch perl git bzip2 xz-utils gzip g++ debianutils ca-certificates
          sudo chmod 666 /dev/kvm || true
      - name: Restore download and compiler caches
        uses: actions/cache@v4
        with:
          path: |
            dl
            .ccache
          key: unit-os-${{ matrix.config }}-${{ hashFiles('external/configs/*', '.gitmodules') }}-${{ github.run_id }}
          restore-keys: |
            unit-os-${{ matrix.config }}-${{ hashFiles('external/configs/*', '.gitmodules') }}-
            unit-os-${{ matrix.config }}-
      - name: Build
        run: |
          set +e
          make UNIT_IMAGE=${{ matrix.config }} > build.log 2>&1 &
          pid=$!
          while kill -0 $pid 2>/dev/null; do sleep 60; grep '^>>>' build.log | tail -1; done
          wait $pid; rc=$?
          [ $rc -ne 0 ] && tail -150 build.log
          exit $rc
        shell: bash
      - name: Record download hashes
        if: always()
        run: find dl -name 'linux-*.tar.*' -exec sha256sum {} \; || true
      - name: Smoke check in emulation
        run: make UNIT_IMAGE=${{ matrix.config }} smoke
      - name: Licence information
        run: make UNIT_IMAGE=${{ matrix.config }} legal-info >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.config }}
          path: |
            output/${{ matrix.config }}/images/
            output/${{ matrix.config }}/legal-info/manifest.csv
            build.log
            smoke.log
          if-no-files-found: warn
