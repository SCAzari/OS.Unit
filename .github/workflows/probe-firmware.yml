name: Probe linux-firmware licences
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-firmware.yml']
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          curl -fsSL -o fw.tar.xz https://cdn.kernel.org/pub/linux/kernel/firmware/linux-firmware-20261019.tar.xz
          tar -tJf fw.tar.xz | grep -iE 'licen[cs]e|whence' | grep -iE 'xe|i915|ipu|intel|whence|^[^/]*/[^/]*$' | head -60
          tar -xJf fw.tar.xz --wildcards '*/WHENCE'
          grep -n -B3 -A3 -E 'ptl_gsc_1|ptl_guc_70|ptl_huc|xe3lpd_dmc|ipu7ptl_fw' */WHENCE
          grep -n -E '^Licen[cs]e:.*(xe|i915|ipu|Intel)' */WHENCE | sort -u | head -20
