[package]
name = "unit-services"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
resolver = "3"
license = "LicenseRef-Unit-Proprietary"
description = "Unit Settings, Notification and Session services, first slice (Software Architecture r1.16 §4)"
publish = false

[dependencies]
async-io = "2"
futures-lite = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }

[profile.release]
lto = "thin"
