[package]
name = "unit-spike-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "LicenseRef-Unit-Proprietary"
description = "Toolkit spike (UNIT-OS-WP-0010): reference screen reader and switch scanner over AT-SPI"
publish = false

[dependencies]
atspi-proxies = "0.13"
atspi-common = "0.13"
zbus = { version = "5", default-features = false, features = ["async-io"] }
futures-lite = "2"
async-io = "2"
serde_json = "1"

[profile.release]
lto = "thin"
