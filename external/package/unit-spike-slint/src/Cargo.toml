[package]
name = "unit-spike-slint"
version = "0.1.0"
edition = "2024"
# Buildroot 2026.08.1's Rust 1.97.1.
rust-version = "1.97"
license = "LicenseRef-Unit-Proprietary"
description = "Toolkit spike (UNIT-OS-WP-0010): the sign-in and settings screens in Slint"
publish = false

[dependencies.slint]
# 1.18.1: the first Slint whose text inputs give assistive technology their text (text runs);
# needs Rust 1.92. 1.19 is less than two weeks old.
version = "=1.18.1"
default-features = false
features = ["std", "compat-1-2", "backend-winit-wayland", "renderer-femtovg", "accessibility"]

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
lto = "thin"
